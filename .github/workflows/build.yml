name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      # The Swing integration tests skip themselves without a display, so run under Xvfb.
      - name: Test
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ./gradlew test --no-daemon 2>&1 | tee build.log
      # Compiler errors and failed tests as annotations, readable in the pull request without the log.
      - name: Report failures
        if: failure()
        run: |
          grep -E "\.java:[0-9]+: error:|Test.* FAILED|^\s+(org\.opentest4j|java\.lang)\.[A-Za-z]+(Error|Exception)" build.log \
            | head -40 | sed 's/^/::error::/' || true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
