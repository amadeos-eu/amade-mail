plugins {
    id 'java'
    id 'application'
}

group = 'org.datazuul.amadeos'
version = '0.1.0'

def mainClassName = 'org.datazuul.amadeos.mail.bootstrap.AmadeMailApplication'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = mainClassName
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Theme, Motif look, start-up, keyring and XDG helpers shared by all amadeOS applications.
    // With ../amade-commons checked out, settings.gradle builds that checkout instead (composite build).
    implementation 'com.github.datazuul:amade-commons:327fe95f3e'

    // Mail: Jakarta Mail API with the Eclipse Angus implementation (IMAP, SMTP, MIME).
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation 'org.eclipse.angus:angus-mail:2.0.3'
    runtimeOnly 'org.eclipse.angus:angus-activation:2.0.2'

    // HTML mail: jsoup cleans and repairs the HTML, Flying Saucer renders XHTML + CSS 2.1 in Swing.
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'org.xhtmlrenderer:flying-saucer-core:9.9.0'

    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Tests compare English texts, whatever the language of the build machine.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

jar {
    archiveBaseName = 'amade-mail'
    manifest {
        attributes(
            'Main-Class': mainClassName,
            'Implementation-Title': 'amade-mail',
            'Implementation-Version': project.version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Signed dependency jars would otherwise invalidate the fat jar.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('deb') {
    dependsOn jar
    description = 'Builds a standard Debian (.deb) package for amade-mail'
    group = 'distribution'

    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        def stagingDir = new File(buildDirFile, 'deb-staging')
        delete(stagingDir)

        def optDir = new File(stagingDir, 'opt/amade-mail')
        def binDir = new File(stagingDir, 'usr/bin')
        def appDir = new File(stagingDir, 'usr/share/applications')
        def iconDir = new File(stagingDir, 'usr/share/icons/hicolor/48x48/apps')
        def docDir = new File(stagingDir, 'usr/share/doc/amade-mail')
        def debianDir = new File(stagingDir, 'DEBIAN')
        def distDir = new File(buildDirFile, 'distributions')
        [optDir, binDir, appDir, iconDir, docDir, debianDir, distDir]*.mkdirs()

        copy {
            from jar.archiveFile
            into optDir
            rename { 'amade-mail.jar' }
        }

        def launcher = new File(binDir, 'amade-mail')
        launcher.text = """#!/bin/sh
exec /usr/bin/java -jar /opt/amade-mail/amade-mail.jar "\$@"
"""
        launcher.setExecutable(true, false)

        copy {
            from 'packaging/amade-mail.desktop'
            into appDir
        }
        copy {
            from 'src/main/resources/icons/amade-mail.png'
            into iconDir
        }
        copy {
            from 'LICENSE'
            into docDir
            rename { 'copyright' }
        }

        new File(debianDir, 'control').text = """Package: amade-mail
Version: ${project.version}
Section: mail
Priority: optional
Architecture: all
Depends: default-jre | openjdk-21-jre | java21-runtime
Recommends: libsecret-tools, xdg-utils
Maintainer: amadeOS Project <developers@datazuul.com>
Description: CDE-style mail client for amadeOS
 A Motif/CDE-styled IMAP and SMTP mail client for the amadeOS desktop,
 modelled on the CDE Mailer (dtmail), with a folder tree, multiple
 accounts and sanitised HTML mail display.
"""

        def debFile = new File(distDir, "amade-mail_${project.version}_all.deb")
        def process = new ProcessBuilder('dpkg-deb', '--root-owner-group', '--build',
                stagingDir.absolutePath, debFile.absolutePath)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('dpkg-deb failed')
        }
        println "[deb] Created ${debFile.absolutePath}"
    }
}

tasks.register('installToAmadeOs') {
    dependsOn 'deb'
    description = 'Builds and drops the .deb package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-mail_${project.version}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}
